{% extends "base.html" %}
{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
<div class="container mt-5 col-md-6">

    <div class="card shadow-sm p-4 text-center" style="border-radius: 1rem;">

        <!-- Título -->
        <h3 class="mb-3 text-danger">
            <i class="bi bi-exclamation-triangle me-2"></i>
            ¿Eliminar Cliente?
        </h3>

        <p class="mb-4">
            Estás a punto de eliminar al cliente<br>
            <strong class="text-dark">{{ object.name }}</strong>.
            <br>
            <span class="text-muted">Esta acción no se puede deshacer.</span>
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger px-4 py-2">
                <i class="bi bi-trash me-1"></i> Eliminar
            </button>

            <a href="{% url 'customer_detail' object.pk %}"
               class="btn btn-secondary px-4 py-2 ms-2">
                Cancelar
            </a>
        </form>

    </div>

</div>
{% endblock %}
